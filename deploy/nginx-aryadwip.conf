# aryadwip.com — konfigurasi Nginx (reverse proxy ke Bun / react-router-serve).
#
# Pasang di VPS:
#   sudo cp deploy/nginx-aryadwip.conf /etc/nginx/sites-available/aryadwip.com
#   sudo ln -s /etc/nginx/sites-available/aryadwip.com /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#
# Kalau belum punya SSL, jalankan dulu (ganti email):
#   sudo certbot --nginx -d aryadwip.com -d www.aryadwip.com
# lalu sesuaikan path sertifikat di bawah.

# Redirect HTTP -> HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name aryadwip.com www.aryadwip.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name aryadwip.com www.aryadwip.com;

    # Let's Encrypt (isi sesuai hasil certbot)
    ssl_certificate     /etc/letsencrypt/live/www.aryadwip.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/www.aryadwip.com/privkey.pem;

    # gzip
    gzip on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript
               application/xml image/svg+xml font/woff2;

    # Semua request diteruskan ke Bun (react-router-serve) di port 3000.
    # Header cache sudah diatur aplikasi:
    #   - HTML     -> Cache-Control: no-cache, no-store, must-revalidate
    #                 (mencegah halaman stale yang merujuk asset hash lama = 404)
    #   - /assets/ -> cache immutable (file ber-hash), di-set react-router-serve
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Jangan pernah meng-cache HTML di Nginx
        proxy_no_cache 1;
        proxy_cache_bypass 1;
    }
}
